<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1490" viewBox="0 0 1600 1490"><rect width="1600" height="1490" fill="#f4f2eb"/><g font-family="Arial,sans-serif" fill="#234b3b"><text x="45" y="50" font-size="30" font-weight="bold">ISM Digital Museum · Wireframe / Prototype</text><text x="45" y="85" font-size="18" fill="#657064">Desktop болон mobile бүтэц · Ажилладаг prototype: swe-hw-9f89.vercel.app</text><text x="45" y="125" font-size="20">DESKTOP</text><text x="1175" y="125" font-size="20">MOBILE</text><rect x="45" y="145" width="1050" height="65" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="173" font-size="17" font-weight="bold" fill="#234b3b">ISM ARCHIVE   |   Үзэсгэлэн · Түүх · Тэнхим · Хүмүүс · Үйл явдал · Оюутан   |   Нэвтрэх</text><rect x="45" y="230" width="615" height="185" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="258" font-size="17" font-weight="bold" fill="#234b3b">Нүүр / Hero</text><text x="61" y="284" font-size="14" fill="#234b3b">Зорилго, тайлбар, музей үзэх товч, статистик</text><rect x="680" y="230" width="415" height="185" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="696" y="258" font-size="17" font-weight="bold" fill="#234b3b">Онцлох бүтээлийн зураг</text><text x="696" y="284" font-size="14" fill="#234b3b">Бүтээлийн нэр, зохиогч, он</text><rect x="45" y="435" width="1050" height="85" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="463" font-size="17" font-weight="bold" fill="#234b3b">Үзэсгэлэн: хайлт + ангилал + төрөл + эрэмбэ</text><text x="61" y="489" font-size="14" fill="#234b3b">[ Хайх… ]   [ Ангилал ]   [ Бүтээлийн төрөл ]   [ + Бүтээл нэмэх ]</text><rect x="45" y="540" width="334" height="125" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="568" font-size="17" font-weight="bold" fill="#234b3b">Үзмэрийн карт</text><text x="61" y="594" font-size="14" fill="#234b3b">Зураг → нэр, зохиогч, он → дэлгэрэнгүй</text><rect x="403" y="540" width="334" height="125" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="419" y="568" font-size="17" font-weight="bold" fill="#234b3b">Үзмэрийн карт</text><text x="419" y="594" font-size="14" fill="#234b3b">Зураг → нэр, зохиогч, он → дэлгэрэнгүй</text><rect x="761" y="540" width="334" height="125" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="777" y="568" font-size="17" font-weight="bold" fill="#234b3b">Үзмэрийн карт</text><text x="777" y="594" font-size="14" fill="#234b3b">Зураг → нэр, зохиогч, он → дэлгэрэнгүй</text><rect x="45" y="685" width="1050" height="95" rx="5" fill="#234b3b" stroke="#b6c3b4"/><text x="61" y="713" font-size="17" font-weight="bold" fill="white">Түүхийн timeline</text><text x="61" y="739" font-size="14" fill="white">2005 → 2022 → Өнөөдөр</text><rect x="45" y="800" width="1050" height="95" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="828" font-size="17" font-weight="bold" fill="#234b3b">Тэнхим</text><text x="61" y="854" font-size="14" fill="#234b3b">Танилцуулга, хөтөлбөр, судалгаа, холбоо барих</text><rect x="45" y="915" width="1050" height="95" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="943" font-size="17" font-weight="bold" fill="#234b3b">Багш нар + ISM Creators</text><text x="61" y="969" font-size="14" fill="#234b3b">Багшийн дэлгэрэнгүй · бүтээгч → бүтээл</text><rect x="45" y="1030" width="1050" height="95" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="1058" font-size="17" font-weight="bold" fill="#234b3b">Арга хэмжээ → зурагт цомог</text><text x="61" y="1084" font-size="14" fill="#234b3b">Нэр, огноо, тайлбар → зураг / өгүүлэл</text><rect x="45" y="1145" width="510" height="100" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="1173" font-size="17" font-weight="bold" fill="#234b3b">Оюутны профайл</text><text x="61" y="1199" font-size="14" fill="#234b3b">Миний мэдээлэл · Миний бүтээлүүд</text><rect x="575" y="1145" width="520" height="100" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="591" y="1173" font-size="17" font-weight="bold" fill="#234b3b">Админ (эрхтэй үед)</text><text x="591" y="1199" font-size="14" fill="#234b3b">CRUD · төлөв · цомгийн удирдлага</text><rect x="45" y="1265" width="1050" height="95" rx="5" fill="#234b3b" stroke="#b6c3b4"/><text x="61" y="1293" font-size="17" font-weight="bold" fill="white">Digital Time Capsule + Захианы хана</text><text x="61" y="1319" font-size="14" fill="white">Захиа илгээх → админы хяналт → нийтлэх</text><rect x="45" y="1380" width="1050" height="65" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="61" y="1408" font-size="17" font-weight="bold" fill="#234b3b">Footer: холбоо барих, social, он</text><rect x="1175" y="145" width="380" height="65" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1191" y="173" font-size="17" font-weight="bold" fill="#234b3b">ISM ARCHIVE        Нэвтрэх   ☰</text><rect x="1175" y="230" width="380" height="100" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1191" y="258" font-size="17" font-weight="bold" fill="#234b3b">Нүүр / Hero</text><text x="1191" y="284" font-size="14" fill="#234b3b">Гарчиг · тайлбар · үндсэн товч</text><rect x="1175" y="350" width="380" height="130" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1191" y="378" font-size="17" font-weight="bold" fill="#234b3b">Онцлох бүтээлийн зураг</text><rect x="1175" y="500" width="380" height="85" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1191" y="528" font-size="17" font-weight="bold" fill="#234b3b">Хайлт / ангилал / төрөл</text><text x="1191" y="554" font-size="14" fill="#234b3b">Шүүлтүүрүүд мөрөөр шилжинэ</text><rect x="1175" y="605" width="180" height="120" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1191" y="633" font-size="17" font-weight="bold" fill="#234b3b">Карт 1</text><text x="1191" y="659" font-size="14" fill="#234b3b">Зураг + нэр</text><rect x="1375" y="605" width="180" height="120" rx="5" fill="#ffffff" stroke="#b6c3b4"/><text x="1391" y="633" font-size="17" font-weight="bold" fill="#234b3b">Карт 2</text><text x="1391" y="659" font-size="14" fill="#234b3b